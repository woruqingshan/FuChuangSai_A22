# Public web stack for the CPU server.
# Usage:
#   docker compose -f compose.yaml -f compose.public.yaml up -d --build

services:
  edge-backend:
    build:
      context: .
      dockerfile: local/edge-backend/Dockerfile.public
    image: a22/edge-backend:latest
    restart: unless-stopped
    environment:
      CLOUD_API_BASE: http://127.0.0.1:29000
      REMOTE_TRANSPORT: http
      REMOTE_TIMEOUT_SECONDS: "120"
      STATUS_TIMEOUT_SECONDS: "2.5"
      MEDIA_CONNECT_TIMEOUT_SECONDS: "5"
      MEDIA_MANIFEST_TIMEOUT_SECONDS: "5"
      MEDIA_READ_TIMEOUT_SECONDS: "300"
      SESSION_COOKIE_NAME: a22_session
      SESSION_TTL_SECONDS: "86400"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: lax
    command: ["uvicorn", "app:app", "--host", "127.0.0.1", "--port", "18080"]
    volumes:
      - a22_logs:/logs
      - a22_data:/data
    network_mode: host

  public-web:
    build:
      context: ./local/frontend
      dockerfile: Dockerfile.public
    image: a22/public-web:latest
    restart: unless-stopped
    depends_on:
      - edge-backend
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: host

volumes:
  caddy_data:
  caddy_config:
