# Public web stack for the CPU server.
# Usage:
#   docker compose -f compose.yaml -f compose.public.yaml up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  edge-backend:
    build:
      context: .
      dockerfile: local/edge-backend/Dockerfile.public
    image: a22/edge-backend:latest
    restart: unless-stopped
    environment:
      CLOUD_API_BASE: http://127.0.0.1:29000
      REMOTE_TRANSPORT: http
      REMOTE_TIMEOUT_SECONDS: "120"
      STATUS_TIMEOUT_SECONDS: "2.5"
      MEDIA_CONNECT_TIMEOUT_SECONDS: "5"
      MEDIA_MANIFEST_TIMEOUT_SECONDS: "5"
      MEDIA_READ_TIMEOUT_SECONDS: "300"
      SESSION_COOKIE_NAME: a22_session
      SESSION_TTL_SECONDS: "86400"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: lax
      ACCESS_COOKIE_NAME: a22_access
      ACCESS_TTL_SECONDS: "86400"
      AUTH_COOKIE_NAME: a22_auth
      AUTH_TTL_SECONDS: "604800"
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      REDIS_KEY_PREFIX: a22
      DATABASE_URL: ${DATABASE_URL}
      INVITATION_CODES_JSON: ${INVITATION_CODES_JSON:-[]}
      INVITATION_VERIFY_RATE_LIMIT_COUNT: "10"
      INVITATION_VERIFY_RATE_LIMIT_WINDOW_SECONDS: "600"
      CHAT_SESSION_RATE_LIMIT_COUNT: "5"
      CHAT_SESSION_RATE_LIMIT_WINDOW_SECONDS: "1800"
      CHAT_IP_RATE_LIMIT_COUNT: "15"
      CHAT_IP_RATE_LIMIT_WINDOW_SECONDS: "1800"
      JOB_QUEUE_MAX_PENDING: "3"
      JOB_RENDER_TIMEOUT_SECONDS: "1800"
      JOB_RETENTION_SECONDS: "3600"
      JOB_MANIFEST_POLL_SECONDS: "2"
      REGISTER_IP_RATE_LIMIT_COUNT: "5"
      REGISTER_IP_RATE_LIMIT_WINDOW_SECONDS: "3600"
      LOGIN_IP_RATE_LIMIT_COUNT: "10"
      LOGIN_IP_RATE_LIMIT_WINDOW_SECONDS: "600"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app:app --host 127.0.0.1 --port 18080"]
    depends_on:
      - redis
      - postgres
    volumes:
      - a22_logs:/logs
      - a22_data:/data
    network_mode: host

  public-web:
    build:
      context: ./local/frontend
      dockerfile: Dockerfile.public
    image: a22/public-web:latest
    restart: unless-stopped
    depends_on:
      - edge-backend
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: host

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
